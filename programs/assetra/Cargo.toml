[package]
name = "assetra"
version = "0.1.0"
description = "Assetra — Music RWA marketplace: royalty-revenue tokenization on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "assetra"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]


[dependencies]
anchor-lang = { version = "1", features = ["init-if-needed"] }
anchor-spl = { version = "1",  default-features = false, features = ["mint", "token_2022", "associated_token"]  }


[dev-dependencies]
litesvm = "0.12.0"
solana-message = "4.1.1"
solana-transaction = "3.1.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "4.0.0"
litesvm-token = "0.12.0"
solana-sdk= "4.0.1"