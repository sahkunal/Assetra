[package]
name = "assetra"
version = "0.1.0"
description = "Assetra — Music RWA marketplace: royalty-revenue tokenization on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "assetra"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]


[dependencies]
anchor-lang = { version = "1", features = ["init-if-needed"] }
anchor-spl =  "1"


[dev-dependencies]
litesvm = "0.12.0"
solana-account = "3"
anchor-litesvm = "0.4.0"
litesvm-utils = "0.4.0"
serde_json = "1"
spl-token = { version = "9.0.0", default-features = false, features = ["no-entrypoint"] }
