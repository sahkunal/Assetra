[package]
name = "assetra"
version = "0.1.0"
description = "Assetra — Music RWA marketplace: royalty-revenue tokenization on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "assetra"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]


[dependencies]
anchor-lang = { version = "1", features = ["init-if-needed"] }
anchor-spl =  "1"


[dev-dependencies]
litesvm = "0.12.0"
litesvm-token = "0.12.0"
solana-account = "3"
solana-message = "4.1.1"
solana-transaction = "3.1.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "4.0.0"
anchor-litesvm = "0.4.0"
litesvm-utils = "0.4.0"
solana-sdk = "5.0.0"
